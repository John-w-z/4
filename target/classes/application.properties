spring.application.name=Proyecto_chilis
#conexion
spring.datasource.url=jdbc:mysql://localhost:3306/chilis_db_final?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789

# Configuración de JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Credenciales por defecto personalizadas para Spring Security
spring.security.user.name=admin
spring.security.user.password=123456
spring.security.user.roles=ADMIN